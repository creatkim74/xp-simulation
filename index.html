<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XP Economy Simulation Dashboard v5</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#fafaf9;--tx:#1c1917;--tx2:#78716c;--tx3:#a8a29e;--bd:#e7e5e4;--bd2:#d6d3d1;--acc:#534AB7;--ok:#16a34a;--no:#dc2626;--warn:#d97706;--info:#2563eb;--r:8px;--rl:12px;--f:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--bg2:#292524;--bg3:#1c1917;--tx:#fafaf9;--tx2:#a8a29e;--tx3:#78716c;--bd:#44403c;--bd2:#57534e;--acc:#AFA9EC;--ok:#4ade80;--no:#f87171;--warn:#fbbf24;--info:#60a5fa}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg3);color:var(--tx);line-height:1.6;min-height:100vh}
.hdr{background:var(--bg);border-bottom:1px solid var(--bd);padding:14px 0;position:sticky;top:0;z-index:100}
.hdr-in{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.hdr h1 i{color:var(--acc)}
.hdr .sub{font-size:11px;color:var(--tx2)}
.ctn{max-width:1280px;margin:0 auto;padding:16px 24px}
.tabs{display:flex;background:var(--bg);border-radius:var(--rl);border:1px solid var(--bd);overflow:hidden;margin-bottom:16px}
.tb{flex:1;padding:10px 12px;font-size:13px;font-weight:500;background:none;border:none;color:var(--tx2);cursor:pointer;font-family:var(--f);display:flex;align-items:center;justify-content:center;gap:5px;border-bottom:2px solid transparent;transition:.2s}
.tb:hover{background:var(--bg2)}.tb.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--bg2)}
.tp{display:none}.tp.on{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:768px){.g2,.g3{grid-template-columns:1fr}}
.cd{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);padding:16px}
.ct{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.ct i{color:var(--acc);font-size:16px}.ct .tg{margin-left:auto;color:var(--tx3);font-size:14px;transition:transform .2s}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media(max-width:600px){.ig{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tip{cursor:help;font-size:9px;width:14px;height:14px;border-radius:50%;background:#E6F1FB;color:#185FA5;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;border:none}
@media(prefers-color-scheme:dark){.tip{background:#0C447C;color:#85B7EB}}
.tag{display:inline-block;font-size:8px;padding:1px 5px;border-radius:3px;font-weight:600}
.tag-k{background:#FAEEDA;color:#854F0B}.tag-n{background:#E6F1FB;color:#185FA5}
@media(prefers-color-scheme:dark){.tag-k{background:#412402;color:#FAC775}.tag-n{background:#042C53;color:#85B7EB}}
.ir{display:flex;align-items:center;gap:6px}
.ir input[type=number]{width:110px;height:34px;font-size:13px;font-weight:600;text-align:right;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--acc);padding:0 8px;font-family:var(--f);font-variant-numeric:tabular-nums}
.ir input:hover{border-color:var(--bd2)}.ir input:focus{outline:2px solid var(--acc);border-color:transparent}
.ir .u{font-size:11px;color:var(--tx3);min-width:28px}
.ir .calc{font-size:11px;color:var(--info);font-weight:600;min-width:60px;text-align:left}
.ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:16px}
.mc{background:var(--bg2);border-radius:var(--r);padding:12px 14px;border:1px solid var(--bd)}
.mc .ml{font-size:10px;color:var(--tx2);margin-bottom:3px}.mc .mv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.mc .mv.pos{color:var(--ok)}.mc .mv.neg{color:var(--no)}.mc .mv.warn{color:var(--warn)}
.mc .ms2{font-size:10px;color:var(--tx3);margin-top:2px}
.bx{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);padding:16px 18px;margin-bottom:14px}
.bx-t{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}.bx-t i{color:var(--acc)}
.cr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;border-bottom:1px solid var(--bd)}
.cr:last-child{border-bottom:none}.cr .cl{color:var(--tx2)}.cr .cv{font-weight:600;font-variant-numeric:tabular-nums}
.bo{height:22px;background:var(--bd);border-radius:11px;overflow:hidden}.bi{height:100%;border-radius:11px;transition:width .4s}
.bl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx2);margin-top:3px}
.chw{position:relative;width:100%;height:260px}
.ttip{display:none;position:fixed;z-index:1000;background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r);padding:8px 12px;font-size:11px;color:var(--tx2);max-width:300px;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.12);pointer-events:none}
.st{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.st th,.st td{padding:6px 8px;text-align:center;border:1px solid var(--bd)}.st th{background:var(--bg2);font-weight:600;font-size:11px}
.st td.pos{background:#EAF3DE;color:#3B6D11}.st td.neg{background:#FCEBEB;color:#A32D2D}.st td.cur{outline:3px solid var(--acc);font-weight:700}
@media(prefers-color-scheme:dark){.st td.pos{background:#173404;color:#97C459}.st td.neg{background:#501313;color:#F09595}}
.rb{padding:7px 14px;font-size:12px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);cursor:pointer;font-family:var(--f);display:flex;align-items:center;gap:4px}.rb:hover{background:var(--bd)}
.cb{overflow:hidden;transition:max-height .3s;max-height:800px}.cb.off{max-height:0}
.fn{padding:8px 12px;border-radius:var(--r);font-size:11px;font-weight:600;text-align:center;min-width:80px}
.fn.em{background:#FCEBEB;color:#A32D2D}.fn.ab{background:#EAF3DE;color:#3B6D11}.fn.nu{background:var(--bg2);color:var(--tx)}
@media(prefers-color-scheme:dark){.fn.em{background:#501313;color:#F09595}.fn.ab{background:#173404;color:#97C459}}
.fd{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px 0}
.fa{font-size:16px;color:var(--tx3)}
.sect{border-left:3px solid var(--acc);padding-left:10px;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--acc)}
.note{font-size:11px;color:var(--tx2);background:var(--bg2);border-radius:var(--r);padding:8px 10px;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in"><div><h1><i class="ti ti-coin"></i> XP Economy Simulation v5</h1><div class="sub">포인트 토큰 + XP 코인 이중 경제 시뮬레이션</div></div><button class="rb" onclick="resetAll()"><i class="ti ti-refresh"></i> 초기화</button></div></div>

<div class="ctn">
<div class="tabs">
<button class="tb on" onclick="sw(0)"><i class="ti ti-adjustments"></i> 변수 입력</button>
<button class="tb" onclick="sw(1)"><i class="ti ti-chart-bar"></i> 시뮬레이션</button>
<button class="tb" onclick="sw(2)"><i class="ti ti-pickaxe"></i> 포인트 경제</button>
<button class="tb" onclick="sw(3)"><i class="ti ti-ticket"></i> 복권 경제</button>
<button class="tb" onclick="sw(4)"><i class="ti ti-table"></i> 민감도</button>
</div>

<!-- ===== TAB 0: 변수 입력 ===== -->
<div class="tp on" id="p0">
<div class="g2">

<div class="cd"><div class="ct" onclick="tg(this)"><i class="ti ti-settings"></i> 공통 설정<i class="ti ti-chevron-down tg"></i></div>
<div class="cb"><div class="ig">
<div class="fg"><label>XP 코인 현재 시세 <span class="tip" onmouseenter="tt(event,'XP 코인의 현재 원화 시세. 매출·매입·스왑 비율 모두에 영향.')">?</span></label><div class="ir"><input type="number" min="1" step="1" value="40" id="xpPrice" oninput="u()"><span class="u">원/XP</span></div></div>
<div class="fg"><label>XP 스왑 기준가 <span class="tag tag-n">신규</span> <span class="tip" onmouseenter="tt(event,'포인트→XP 스왑 환율의 기준 가격. 30원 기준: XP가 40원이면 1XP당 40/30=1.33포인트 필요. XP가 비싸질수록 같은 포인트로 받는 XP가 줄어듭니다.')">?</span></label><div class="ir"><input type="number" min="1" step="1" value="30" id="xpBase" oninput="u()"><span class="u">원</span><span class="calc" id="swapRatio_v"></span></div></div>
<div class="fg"><label>DAU</label><div class="ir"><input type="number" min="1" step="100" value="1000" id="dau" oninput="u()"><span class="u">명</span></div></div>
<div class="fg"><label>월 환산 일수</label><div class="ir"><input type="number" min="1" step="1" value="30" id="md" oninput="u()"><span class="u">일</span></div></div>
</div></div></div>

<div class="cd"><div class="ct" onclick="tg(this)"><i class="ti ti-car"></i> 무료 포인트 마이닝<i class="ti ti-chevron-down tg"></i></div>
<div class="cb"><div class="ig">
<div class="fg"><label>1인당 일일 포인트 적립 상한 <span class="tag tag-k">핵심</span> <span class="tip" onmouseenter="tt(event,'1계정이 하루에 무료로 적립할 수 있는 최대 포인트 수. 게임은 무제한이지만 포인트 적립은 이 상한으로 제한됩니다. XP 배출량을 결정하는 핵심 레버.')">?</span></label><div class="ir"><input type="number" min="1" step="100" value="5000" id="freeCapPt" oninput="u()"><span class="u">PT</span></div></div>
<div class="fg"><label>랩(바퀴)당 적립 포인트 <span class="tip" onmouseenter="tt(event,'차량이 1바퀴 레이싱할 때 적립되는 포인트. 차량 등급·속도 아이템에 따라 달라질 수 있습니다.')">?</span></label><div class="ir"><input type="number" min="1" step="1" value="10" id="ptPerLap" oninput="u()"><span class="u">PT/랩</span><span class="calc" id="maxLaps_v"></span></div></div>
<div class="fg"><label>차량 구매 비용 (포인트) <span class="tip" onmouseenter="tt(event,'인게임에서 차량을 포인트로 구매하는 비용. 포인트 소비처(싱크)로 작용합니다.')">?</span></label><div class="ir"><input type="number" min="0" step="100" value="2000" id="carCostPt" oninput="u()"><span class="u">PT</span></div></div>
<div class="fg"><label>차량 합성 비용 (포인트) <span class="tip" onmouseenter="tt(event,'차량 합성(Merge) 시 소모되는 포인트. 포인트 싱크 역할.')">?</span></label><div class="ir"><input type="number" min="0" step="100" value="1000" id="mergeCostPt" oninput="u()"><span class="u">PT</span></div></div>
<div class="fg"><label>속도 아이템 비용 (포인트) <span class="tip" onmouseenter="tt(event,'속도 부스트 아이템 1개 구매 시 포인트 비용.')">?</span></label><div class="ir"><input type="number" min="0" step="50" value="500" id="itemCostPt" oninput="u()"><span class="u">PT</span></div></div>
<div class="fg"><label>인게임 포인트 소비율 <span class="tip" onmouseenter="tt(event,'적립 포인트 중 인게임(차 구매·합성·아이템)에 소비하는 평균 비율. 나머지가 XP 스왑 대상.')">?</span></label><div class="ir"><input type="number" min="0" max="100" step="5" value="30" id="inGameSpend" oninput="u()"><span class="u">%</span></div></div>
</div></div></div>

<div class="cd"><div class="ct" onclick="tg(this)"><i class="ti ti-transfer-in"></i> 유료 마이닝 (XP 투입)<i class="ti ti-chevron-down tg"></i></div>
<div class="cb"><div class="ig">
<div class="fg"><label>XP 투입 마이닝 유저 비율 <span class="tip" onmouseenter="tt(event,'DAU 중 XP 코인을 게임 지갑에 넣어 유료 마이닝하는 유저 비율. XP를 투입하면 더 많은 포인트를 적립할 수 있습니다.')">?</span></label><div class="ir"><input type="number" min="0" max="100" step="1" value="10" id="paidRate" oninput="u()"><span class="u">%</span></div></div>
<div class="fg"><label>1인당 일일 XP 투입량 <span class="tip" onmouseenter="tt(event,'유료 마이닝 유저가 하루에 투입하는 XP 수량. 투입 XP는 소모됩니다(프로젝트 수입).')">?</span></label><div class="ir"><input type="number" min="1" step="10" value="100" id="paidXPDay" oninput="u()"><span class="u">XP</span></div></div>
<div class="fg"><label>XP 투입 시 포인트 배율 <span class="tip" onmouseenter="tt(event,'XP를 투입하면 기본 적립 대비 몇 배의 포인트를 추가로 적립하는지. 2.0x면 무료분+추가 100% = 총 2배.')">?</span></label><div class="ir"><input type="number" min="1" max="10" step="0.5" value="2" id="paidMulti" oninput="u()"><span class="u">x배</span></div></div>
<div class="fg"><label>유료 유저 일일 포인트 상한 <span class="tip" onmouseenter="tt(event,'유료 마이닝 유저의 일일 포인트 적립 상한. 무료 상한 × 배율이 기본이지만, 별도 상한을 설정할 수 있습니다.')">?</span></label><div class="ir"><input type="number" min="1" step="1000" value="10000" id="paidCapPt" oninput="u()"><span class="u">PT</span></div></div>
</div></div></div>

<div class="cd"><div class="ct" onclick="tg(this)"><i class="ti ti-trophy"></i> 프로모션 / 랭킹 보상<i class="ti ti-chevron-down tg"></i></div>
<div class="cb"><div class="ig">
<div class="fg"><label>일일 프로모션 포인트 예산 <span class="tag tag-k">핵심</span> <span class="tip" onmouseenter="tt(event,'프로모션/이벤트로 하루 총 지급하는 포인트 예산. 랭킹 상위 유저에게 배분됩니다. 추가 포인트 배출이므로 XP 스왑 시 비용 증가 요인.')">?</span></label><div class="ir"><input type="number" min="0" step="10000" value="100000" id="promoBudget" oninput="u()"><span class="u">PT/일</span></div></div>
<div class="fg"><label>프로모션 수혜 유저 비율 <span class="tip" onmouseenter="tt(event,'DAU 중 랭킹 보상을 받는 유저 비율. 상위 N% 유저에게 집중 배분.')">?</span></label><div class="ir"><input type="number" min="1" max="100" step="1" value="20" id="promoRate" oninput="u()"><span class="u">%</span></div></div>
<div class="fg"><label>보상 유저의 XP 스왑율 <span class="tip" onmouseenter="tt(event,'프로모션 포인트를 받은 유저가 해당 포인트를 XP로 스왑하는 비율. 높을수록 XP 배출 증가.')">?</span></label><div class="ir"><input type="number" min="0" max="100" step="5" value="50" id="promoSwapRate" oninput="u()"><span class="u">%</span></div></div>
</div>
<div class="note"><b>랭킹 기준:</b> 마이닝 횟수(랩 수) · 포인트→XP 스왑량 · 복권 플레이 횟수 · 복권 베팅 XP량 · 차량 보유수 등 복합 가중치로 산정</div>
</div></div>

<div class="cd"><div class="ct" onclick="tg(this)"><i class="ti ti-ticket"></i> 복권 게임 (XP 사용, 별도)<i class="ti ti-chevron-down tg"></i></div>
<div class="cb"><div class="ig">
<div class="fg"><label>복권 참여율 <span class="tip" onmouseenter="tt(event,'DAU 중 XP를 사용하여 복권에 참여하는 비율. 마이닝과 별개의 게임.')">?</span></label><div class="ir"><input type="number" min="0" max="100" step="1" value="15" id="lotRate" oninput="u()"><span class="u">%</span></div></div>
<div class="fg"><label>1인당 플레이수/일 <span class="tip" onmouseenter="tt(event,'복권 참여자 1인의 일일 플레이 횟수(재베팅 포함).')">?</span></label><div class="ir"><input type="number" min="1" step="5" value="50" id="lotPlays" oninput="u()"><span class="u">회</span></div></div>
<div class="fg"><label>베팅 XP <span class="tip" onmouseenter="tt(event,'복권 1회 베팅에 필요한 XP. XP를 구매하거나 마이닝 스왑으로 얻은 XP를 사용.')">?</span></label><div class="ir"><input type="number" min="1" step="10" value="50" id="betXP" oninput="u()"><span class="u">XP</span></div></div>
<div class="fg"><label>환급률 (RTP) <span class="tag tag-k">핵심</span> <span class="tip" onmouseenter="tt(event,'★수익 핵심 레버. 베팅 대비 당첨 지급 비율. 하우스마진 = 1-RTP.')">?</span></label><div class="ir"><input type="number" min="1" max="99" step="1" value="70" id="rtp" oninput="u()"><span class="u">%</span></div></div>
</div></div></div>

<div class="cd"><div class="ct" onclick="tg(this)"><i class="ti ti-car"></i> NFT·인앱·합성<i class="ti ti-chevron-down tg"></i></div>
<div class="cb"><div class="ig">
<div class="fg"><label>차량 NFT 구매율 (DAU 중)</label><div class="ir"><input type="number" min="0" max="100" step="0.5" value="3" id="nftRate" oninput="u()"><span class="u">%</span></div></div>
<div class="fg"><label>차량 NFT 가격</label><div class="ir"><input type="number" min="0" step="1000" value="30000" id="nftPrice" oninput="u()"><span class="u">원</span></div></div>
<div class="fg"><label>인앱 결제율</label><div class="ir"><input type="number" min="0" max="100" step="1" value="5" id="boostRate" oninput="u()"><span class="u">%</span></div></div>
<div class="fg"><label>인앱 결제액/일</label><div class="ir"><input type="number" min="0" step="500" value="2000" id="boostAmt" oninput="u()"><span class="u">원</span></div></div>
<div class="fg"><label>합성 소각 수수료 (XP) <span class="tip" onmouseenter="tt(event,'차량 합성 시 XP 수수료. 전액 소각되어 공급 감소.')">?</span></label><div class="ir"><input type="number" min="0" step="10" value="100" id="mergeFeeXP" oninput="u()"><span class="u">XP</span></div></div>
<div class="fg"><label>합성 실행 유저율</label><div class="ir"><input type="number" min="0" max="100" step="0.5" value="4" id="mergeRateXP" oninput="u()"><span class="u">%</span></div></div>
</div></div></div>

<div id="tipEl" class="ttip"></div>

<script>
let ch1=null,ch2=null,ch3=null,ch4=null;
const $=id=>document.getElementById(id);
const fmt=n=>{if(Math.abs(n)>=1e8)return(n/1e8).toFixed(1)+'억';if(Math.abs(n)>=1e4)return(n/1e4).toFixed(0)+'만';return Math.round(n).toLocaleString()};
const fW=n=>{if(Math.abs(n)>=1e8)return'₩'+(n/1e8).toFixed(2)+'억';if(Math.abs(n)>=1e4)return'₩'+(n/1e4).toFixed(0)+'만';return'₩'+Math.round(n).toLocaleString()};
const fS=n=>{if(Math.abs(n)>=1e8)return(n/1e8).toFixed(1)+'억';if(Math.abs(n)>=1e4)return(n/1e4).toFixed(0)+'만';return Math.round(n).toLocaleString()};
const pc=n=>(n*100).toFixed(1)+'%';

const D={xpPrice:40,xpBase:30,dau:1000,md:30,freeCapPt:5000,ptPerLap:10,carCostPt:2000,mergeCostPt:1000,itemCostPt:500,inGameSpend:30,paidRate:10,paidXPDay:100,paidMulti:2,paidCapPt:10000,promoBudget:100000,promoRate:20,promoSwapRate:50,lotRate:15,lotPlays:50,betXP:50,rtp:70,nftRate:3,nftPrice:30000,boostRate:5,boostAmt:2000,mergeFeeXP:100,mergeRateXP:4,swapTx:1,gasPrice:1,swapGas:80000,buyGas:120000,lotGas:130000};
const PCT=['inGameSpend','paidRate','promoRate','promoSwapRate','lotRate','rtp','nftRate','boostRate','mergeRateXP'];

function resetAll(){Object.entries(D).forEach(([k,v])=>{const e=$(k);if(e)e.value=v});u()}
function sw(i){document.querySelectorAll('.tb').forEach((b,j)=>b.classList.toggle('on',j===i));document.querySelectorAll('.tp').forEach((p,j)=>p.classList.toggle('on',j===i));u()}
function tg(el){const b=el.nextElementSibling,ic=el.querySelector('.tg');b.classList.toggle('off');ic.style.transform=b.classList.contains('off')?'rotate(-90deg)':'rotate(0)'}
function tt(e,t){const tip=$('tipEl');tip.textContent=t;tip.style.display='block';const r=e.target.getBoundingClientRect();tip.style.left=Math.min(r.left,innerWidth-320)+'px';tip.style.top=(r.bottom+5)+'px'}
document.addEventListener('mousemove',e=>{if(!e.target.classList.contains('tip'))$('tipEl').style.display='none'});

function gv(id){const raw=+($(id).value);return PCT.includes(id)?raw/100:raw}

function calc(){
  const v={};Object.keys(D).forEach(k=>{v[k]=gv(k)});
  const r={};

  // 스왑 비율: 1 XP = (xpPrice/xpBase) 포인트
  r.ptPerXP=v.xpPrice/v.xpBase;

  // === 무료 포인트 마이닝 ===
  r.freeUsers=v.dau*(1-v.paidRate); // 무료 유저 수
  r.paidUsers=v.dau*v.paidRate;
  r.maxFreeLaps=Math.floor(v.freeCapPt/v.ptPerLap);
  r.freePtTotal=r.freeUsers*v.freeCapPt; // 무료 유저 총 포인트/일
  r.freePtInGame=r.freePtTotal*v.inGameSpend; // 인게임 소비
  r.freePtSwappable=r.freePtTotal-r.freePtInGame; // 스왑 가능

  // === 유료 마이닝 ===
  r.paidPtPerUser=Math.min(v.paidCapPt, v.freeCapPt*v.paidMulti);
  r.paidPtTotal=r.paidUsers*r.paidPtPerUser;
  r.paidPtInGame=r.paidPtTotal*v.inGameSpend;
  r.paidPtSwappable=r.paidPtTotal-r.paidPtInGame;
  r.paidXPInput=r.paidUsers*v.paidXPDay; // 유료유저 XP 투입 (수입)
  r.paidXPInputWon=r.paidXPInput*v.xpPrice;

  // === 프로모션 ===
  r.promoUsers=v.dau*v.promoRate;
  r.promoPtTotal=v.promoBudget;
  r.promoPtSwap=r.promoPtTotal*v.promoSwapRate;
  r.promoPtInGame=r.promoPtTotal-r.promoPtSwap;

  // === 포인트 총계 ===
  r.totalPtEmit=r.freePtTotal+r.paidPtTotal+r.promoPtTotal;
  r.totalPtInGame=r.freePtInGame+r.paidPtInGame+r.promoPtInGame;
  r.totalPtSwap=r.freePtSwappable+r.paidPtSwappable+r.promoPtSwap;

  // === 포인트→XP 스왑 ===
  r.swapXP=r.totalPtSwap/r.ptPerXP; // 스왑으로 발행되는 XP
  r.swapXPWon=r.swapXP*v.xpPrice; // 원화 환산 (프로젝트 비용)

  // === 복권 (별도 XP 경제) ===
  r.lotUsers=v.dau*v.lotRate;
  r.lotPlaysTotal=r.lotUsers*v.lotPlays;
  r.totalBetXP=r.lotPlaysTotal*v.betXP;
  r.betRevDay=r.totalBetXP*v.xpPrice;
  r.lotWinXP=r.totalBetXP*v.rtp;
  r.lotWinCost=r.lotWinXP*v.xpPrice;
  r.houseMargin=r.totalBetXP*(1-v.rtp)*v.xpPrice;

  // === NFT·인앱 ===
  r.nftRev=v.dau*v.nftRate*v.nftPrice;
  r.boostRev=v.dau*v.boostRate*v.boostAmt;

  // === 합성 소각 (XP) ===
  r.burnXP=v.dau*v.mergeRateXP*v.mergeFeeXP;
  r.burnWon=r.burnXP*v.xpPrice;

  // === 가스비 ===
  r.txSwap=v.dau*v.swapTx;
  r.txBuy=r.lotUsers;
  r.txLot=r.lotPlaysTotal;
  r.gasXP=(r.txSwap*v.swapGas+r.txBuy*v.buyGas+r.txLot*v.lotGas)*v.gasPrice*1e-9;
  r.gasCost=r.gasXP*v.xpPrice;
  r.gasMonth=r.gasCost*v.md;

  // === 매출 (수입) ===
  r.revLotMargin=r.houseMargin; // 복권 하우스마진
  r.revPaidXP=r.paidXPInputWon; // 유료마이닝 XP투입
  r.revNFT=r.nftRev;
  r.revBoost=r.boostRev;
  r.totalRevDay=r.revLotMargin+r.revPaidXP+r.revNFT+r.revBoost;
  r.totalRevMonth=r.totalRevDay*v.md;

  // === 비용 (지출) ===
  r.costSwapXP=r.swapXPWon; // 포인트→XP 스왑 지급
  r.costLotWin=r.lotWinCost; // 복권 당첨 지급
  r.costGas=r.gasCost;
  r.totalCostDay=r.costSwapXP+r.costGas; // 복권당첨은 handle에서 차감이므로 별도
  r.totalCostMonth=r.totalCostDay*v.md;

  // === 순손익 ===
  r.netDay=r.totalRevDay-r.costSwapXP-r.costGas;
  r.netMonth=r.netDay*v.md;
  r.netMargin=r.totalRevMonth>0?r.netMonth/r.totalRevMonth:0;

  // === 커버리지 ===
  r.coverage=r.costSwapXP>0?r.revLotMargin/r.costSwapXP:0;

  // === XP 순 유통 ===
  r.xpEmit=r.swapXP+r.lotWinXP; // 시장에 나오는 XP
  r.xpAbsorb=r.paidXPInput+r.totalBetXP+r.burnXP; // 시장에서 빠지는 XP
  r.xpNetFlow=r.xpEmit-r.xpAbsorb;

  // === 1인당 지표 ===
  r.freeSwapXPPerUser=r.freeUsers>0?r.freePtSwappable/r.freeUsers/r.ptPerXP:0;
  r.paidSwapXPPerUser=r.paidUsers>0?r.paidPtSwappable/r.paidUsers/r.ptPerXP:0;
  r.lotBetPerUser=r.lotUsers>0?r.totalBetXP/r.lotUsers:0;
  r.lotNetLossPerUser=r.lotUsers>0?(r.totalBetXP-r.lotWinXP)/r.lotUsers:0;
  r.arppuMonth=r.lotUsers>0?r.houseMargin/r.lotUsers*v.md:0;

  return{v,r};
}

function u(){
  const{v,r}=calc();
  $('swapRatio_v').textContent='→ 1XP='+r.ptPerXP.toFixed(2)+'PT';
  $('maxLaps_v').textContent='→ 최대 '+r.maxFreeLaps+'랩';
  renderR(v,r);renderPt(v,r);renderLot(v,r);renderSen(v,r);
}

<div class="mc"><div class="ml">총 수입 / 월</div><div class="mv">${fW(r.totalRevMonth)}</div><div class="ms2">복권마진+XP투입+NFT+인앱</div></div>
<div class="mc"><div class="ml">포인트→XP 비용 / 월</div><div class="mv neg">${fW(r.costSwapXP*v.md)}</div><div class="ms2">${fmt(Math.round(r.swapXP))} XP/일 발행</div></div>
<div class="mc"><div class="ml">커버리지</div><div class="mv ${cc}">${r.coverage.toFixed(2)}x</div><div class="ms2">${r.coverage>=1?'복권이 스왑비용 충당':'미충당'}</div></div>

<div class="mc"><div class="ml">합성 소각 / 월</div><div class="mv">${fW(r.burnWon*v.md)}</div></div>

</div>
<div class="bx"><div class="bx-t"><i class="ti ti-list-details"></i> 지출 상세 (일별)</div>

<div class="cr"><span class="cl">가스비</span><span class="cv">${fW(r.costGas)}</span></div>
<div class="cr" style="font-weight:700;border-top:2px solid var(--bd2)"><span class="cl">합계</span><span class="cv" style="color:var(--no)">${fW(r.totalCostDay)}</span></div>
</div>
</div>
<div class="g2">
<div class="bx"><div class="bx-t"><i class="ti ti-chart-donut"></i> 수입 구성</div><div class="chw"><canvas id="c1" role="img" aria-label="Revenue"></canvas></div>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:11px;color:var(--tx2)">
<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:#534AB7"></span>복권 ${fW(r.revLotMargin)}</span>
<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:#1D9E75"></span>XP투입 ${fW(r.revPaidXP)}</span>
<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:#EF9F27"></span>NFT ${fW(r.revNFT)}</span>

  if(ch1)ch1.destroy();

}

<div class="cr"><span class="cl">XP 스왑 대상</span><span class="cv">${fmt(Math.round(r.promoPtSwap))} PT → ${(r.promoPtSwap/r.ptPerXP).toFixed(0)} XP</span></div>
<div class="cr"><span class="cl">인게임 소비</span><span class="cv">${fmt(Math.round(r.promoPtInGame))} PT</span></div>
<div class="note"><b>랭킹 기준 (복합 가중치):</b> 마이닝 랩 수 · PT→XP 스왑량 · 복권 플레이 횟수 · 복권 베팅 XP량 · 차량 보유수 · 합성 횟수</div>
</div>

<div class="bx"><div class="bx-t"><i class="ti ti-chart-donut"></i> 포인트 발행 vs 소비</div>
<div class="chw"><canvas id="c3" role="img" aria-label="Point flow"></canvas></div>
</div>`;
  if(ch3)ch3.destroy();
  const isDk=matchMedia('(prefers-color-scheme:dark)').matches;
  ch3=new Chart($('c3'),{type:'bar',data:{labels:['무료마이닝','유료마이닝','프로모션','인게임소비','XP스왑'],datasets:[{data:[r.freePtTotal,r.paidPtTotal,r.promoPtTotal,-r.totalPtInGame,-r.totalPtSwap],backgroundColor:['#534AB7','#1D9E75','#EF9F27','#E24B4A','#D85A30'],borderWidth:0,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{autoSkip:false,font:{size:10},color:isDk?'#a8a29e':'#78716c'},grid:{display:false}},y:{ticks:{callback:v=>fmt(v)+'PT',color:isDk?'#a8a29e':'#78716c'},grid:{color:isDk?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)'}}}}});
}

function renderLot(v,r){
  $('lotArea').innerHTML=`
<div class="sect">복권 게임 경제 (XP 사용, 마이닝과 별도)</div>
<div class="ms">
<div class="mc"><div class="ml">복권 참여자</div><div class="mv">${fmt(Math.round(r.lotUsers))}<span style="font-size:12px">명</span></div><div class="ms2">DAU의 ${Math.round(v.lotRate*100)}%</div></div>
<div class="mc"><div class="ml">총 베팅 / 일</div><div class="mv">${fmt(Math.round(r.totalBetXP))}<span style="font-size:12px"> XP</span></div><div class="ms2">${fW(r.betRevDay)}</div></div>
<div class="mc"><div class="ml">하우스마진 / 일</div><div class="mv pos">${fW(r.houseMargin)}</div><div class="ms2">RTP ${Math.round(v.rtp*100)}%</div></div>
<div class="mc"><div class="ml">ARPPU / 월</div><div class="mv">${fW(r.arppuMonth)}</div><div class="ms2">참여자 1인 순지출</div></div>
</div>

<div class="g2">
<div class="bx"><div class="bx-t"><i class="ti ti-user"></i> 1인당 복권 현황 (일별)</div>
<div class="cr"><span class="cl">플레이수</span><span class="cv">${v.lotPlays}회</span></div>
<div class="cr"><span class="cl">총 베팅 XP</span><span class="cv">${fmt(Math.round(r.lotBetPerUser))} XP (${fW(r.lotBetPerUser*v.xpPrice)})</span></div>
<div class="cr"><span class="cl">당첨 환급 (RTP)</span><span class="cv" style="color:var(--ok)">+${fmt(Math.round(r.lotBetPerUser*v.rtp))} XP</span></div>
<div class="cr" style="font-weight:700"><span class="cl">순 XP 손실</span><span class="cv" style="color:var(--no)">${fmt(Math.round(r.lotNetLossPerUser))} XP (${fW(r.lotNetLossPerUser*v.xpPrice)})</span></div>
</div>

<div class="bx"><div class="bx-t"><i class="ti ti-scale"></i> 마이닝 XP vs 복권 비용</div>
<div class="g3" style="margin-bottom:10px">
<div class="mc"><div class="ml">무료유저 일일 XP</div><div class="mv">${r.freeSwapXPPerUser.toFixed(1)}</div></div>
<div class="mc"><div class="ml">유료유저 일일 XP</div><div class="mv">${r.paidSwapXPPerUser.toFixed(1)}</div></div>
<div class="mc"><div class="ml">복권 필요 XP</div><div class="mv warn">${fmt(Math.round(r.lotBetPerUser))}</div></div>
</div>
${(()=>{
  const freeXP=r.freeSwapXPPerUser;
  const need=r.lotBetPerUser;
  const ratio=need>0?freeXP/need:0;
  const bw=Math.min(ratio*100,100);
  return `<div style="margin-bottom:3px;font-size:11px;color:var(--tx2)">무료 마이닝 XP로 복권 커버: <b>${pc(ratio)}</b></div>
<div class="bo"><div class="bi" style="width:${bw}%;background:${ratio>=0.5?'#1D9E75':ratio>=0.2?'#EF9F27':'#E24B4A'}"></div></div>
<div class="bl"><span>마이닝 ${freeXP.toFixed(1)} XP</span><span>복권 ${fmt(Math.round(need))} XP</span></div>
<div class="note">${ratio<0.1?'무료 마이닝 XP로는 복권의 극히 일부만 커버 → 대부분 별도 XP 구매 필요':ratio<0.3?'무료 XP로 일부 커버 가능 → 상당량 별도 구매 필요':ratio<0.7?'무료 XP가 상당 부분 커버 → 구매 부담 감소':'무료 XP만으로 대부분 커버 → 실매출 감소 주의'}</div>`;
})()}
</div>
</div>

<div class="bx"><div class="bx-t"><i class="ti ti-chart-bar"></i> 복권 손익 구조 (일별)</div>
<div class="chw"><canvas id="c4" role="img" aria-label="Lottery P&L"></canvas></div></div>`;

  if(ch4)ch4.destroy();
  const isDk=matchMedia('(prefers-color-scheme:dark)').matches;
  ch4=new Chart($('c4'),{type:'bar',data:{labels:['베팅(handle)','당첨지급','하우스마진'],datasets:[{data:[r.betRevDay,-r.lotWinCost,r.houseMargin],backgroundColor:['#534AB7','#E24B4A','#1D9E75'],borderWidth:0,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:11},color:isDk?'#a8a29e':'#78716c'},grid:{display:false}},y:{ticks:{callback:v=>(v<0?'-':'')+'₩'+fS(Math.abs(v)),color:isDk?'#a8a29e':'#78716c'},grid:{color:isDk?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)'}}}}});
}

function renderSen(v,r){
  const rtps=[0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9];
  const caps=[1000,2000,3000,5000,7000,10000,15000];
  let t='<table class="st"><thead><tr><th>RTP \\ 포인트상한</th>';
  caps.forEach(c=>t+=`<th>${fmt(c)}</th>`);
  t+='</tr></thead><tbody>';
  rtps.forEach(rtp=>{
    t+='<tr><th>'+Math.round(rtp*100)+'%</th>';
    caps.forEach(cap=>{
      const fU=v.dau*(1-v.paidRate);
      const pU=v.dau*v.paidRate;
      const pCap=Math.min(v.paidCapPt,cap*v.paidMulti);
      const tPt=(fU*cap+pU*pCap+v.promoBudget)*(1-v.inGameSpend);
      const swXP=tPt/r.ptPerXP;
      const swCost=swXP*v.xpPrice;
      const hm=v.dau*v.lotRate*v.lotPlays*v.betXP*(1-rtp)*v.xpPrice;
      const paidRev=pU*v.paidXPDay*v.xpPrice;
      const nft=v.dau*v.nftRate*v.nftPrice;
      const boost=v.dau*v.boostRate*v.boostAmt;
      const net=(hm+paidRev+nft+boost-swCost-r.gasCost)*v.md;
      const isCur=Math.abs(rtp-v.rtp)<0.001&&cap===v.freeCapPt;
      t+=`<td class="${net>=0?'pos':'neg'}${isCur?' cur':''}">${fS(net)}</td>`;
    });
    t+='</tr>';
  });
  t+='</tbody></table>';

  $('senArea').innerHTML=`
<div class="bx"><div class="bx-t"><i class="ti ti-table"></i> 민감도 — 순손익/월 (DAU ${fmt(v.dau)})</div>
<p style="font-size:11px;color:var(--tx2);margin-bottom:10px">행=복권 RTP, 열=무료 포인트 상한/일. 초록=흑자, 빨강=적자.</p>
<div style="overflow-x:auto">${t}</div></div>
<div class="g2" style="margin-top:14px">
<div class="bx"><div class="bx-t"><i class="ti ti-chart-line"></i> XP 시세별 스왑 수령 XP</div>
<div class="chw"><canvas id="c2" role="img" aria-label="Swap XP by price"></canvas></div>
<div class="note">XP 시세가 오르면 같은 포인트로 받는 XP가 줄어듭니다 (기준가 ${v.xpBase}원 고정). 시세 하락 시 스왑 XP 증가 → 배출 비용↑.</div>
</div>
<div class="bx"><div class="bx-t"><i class="ti ti-alert-triangle"></i> 손익분기</div>
${(()=>{
  const brkRTP=r.totalBetXP>0?1-(r.costSwapXP+r.costGas-r.revPaidXP-r.revNFT-r.revBoost)/(r.totalBetXP*v.xpPrice):0;
  const brkCap=r.ptPerXP>0&&v.dau>0?(r.totalRevDay-r.costGas)*r.ptPerXP/(v.dau*(1-v.inGameSpend)):0;
  return `<div style="padding:10px 0">
<div class="cr"><span class="cl">손익분기 RTP</span><span class="cv" style="color:var(--warn)">${brkRTP>0&&brkRTP<1?pc(brkRTP):'N/A'}</span></div>
<div class="cr"><span class="cl">손익분기 포인트 상한</span><span class="cv" style="color:var(--warn)">${brkCap>0?fmt(Math.round(brkCap))+' PT':'N/A'}</span></div>
<div class="cr"><span class="cl">현재 일일 마진</span><span class="cv" style="color:${r.netDay>=0?'var(--ok)':'var(--no)'}">${fW(r.netDay)}</span></div>
</div>`;
})()}
</div></div>`;

  if(ch2)ch2.destroy();
  const prices=[10,20,30,40,50,60,80,100,150,200];
  const swapData=prices.map(p=>{const ratio=p/v.xpBase;return v.freeCapPt*(1-v.inGameSpend)/ratio});
  const isDk=matchMedia('(prefers-color-scheme:dark)').matches;
  ch2=new Chart($('c2'),{type:'line',data:{labels:prices.map(p=>p+'원'),datasets:[{label:'무료유저 일일 스왑 XP',data:swapData,borderColor:'#534AB7',backgroundColor:'rgba(83,74,183,.1)',fill:true,tension:.3,pointRadius:4,pointBackgroundColor:prices.map(p=>p===v.xpPrice?'#E24B4A':'#534AB7')}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'XP 시세',color:isDk?'#a8a29e':'#78716c'},ticks:{color:isDk?'#a8a29e':'#78716c'},grid:{display:false}},y:{title:{display:true,text:'스왑 XP',color:isDk?'#a8a29e':'#78716c'},ticks:{color:isDk?'#a8a29e':'#78716c'},grid:{color:isDk?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)'}}}}});
}

u();
</script>
</body>
</html>
